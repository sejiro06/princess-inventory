<!DOCTYPE html>
<html>
<head>
    <title>Add Product - Princess Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container mt-5" style="max-width: 600px;">
    <h2>Add New Product</h2>
    <a href="/products" class="btn btn-secondary mb-3">← Back to Products</a>
    
    <form method="POST">
        <div class="mb-3">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Category</label>
            <input type="text" name="category" class="form-control" value="General">
        </div>
        <div class="mb-3">
            <label>Price (₱)</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Initial Stock</label>
            <input type="number" name="stock" value="0" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Save Product</button>
    </form>
</div>
</body>
</html>
