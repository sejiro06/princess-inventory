<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Princess Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>📦 Products</h1>
    <a href="/" class="btn btn-secondary mb-3">← Dashboard</a>
    <a href="/add_product" class="btn btn-success mb-3">+ Add New Product</a>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
            <tr {% if p['stock'] < 10 %}class="table-danger"{% endif %}>
                <td>{{ p['name'] }}</td>
                <td>{{ p['category'] }}</td>
                <td>₱{{ p['price'] }}</td>
                <td><strong>{{ p['stock'] }}</strong></td>
                <td>
                    <!-- Add Stock -->
                    <form method="POST" action="/update_stock/{{ p['id'] }}" class="d-inline">
                        <input type="hidden" name="action" value="add">
                        <input type="number" name="quantity" value="1" min="1" style="width: 70px;" class="form-control d-inline">
                        <button type="submit" class="btn btn-sm btn-primary">+ Add</button>
                    </form>
                    
                    <!-- Subtract Stock -->
                    <form method="POST" action="/update_stock/{{ p['id'] }}" class="d-inline">
                        <input type="hidden" name="action" value="subtract">
                        <input type="number" name="quantity" value="1" min="1" style="width: 70px;" class="form-control d-inline">
                        <button type="submit" class="btn btn-sm btn-warning">- Take</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
