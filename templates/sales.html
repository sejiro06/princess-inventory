<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .theme-toggle { position: fixed; top: 15px; right: 15px; z-index: 1000; }
    </style>
</head>
<body>
<div class="container mt-4">
    <button onclick="toggleTheme()" class="btn btn-outline-light theme-toggle">🌙 Dark Mode</button>
    
    <h1 class="text-center mb-4">👑 Princess Inventory System</h1>
    
    <div class="row text-center">
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Total Products</h5>
                    <h2 class="text-primary">{{ total_products }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Today's Sales</h5>
                    <h2 class="text-success">₱{{ today_sales }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Low Stock</h5>
                    <h2 class="text-danger">{{ low_stock }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Total Utang</h5>
                    <h2 class="text-warning">₱{{ total_debt }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/products" class="btn btn-primary btn-lg me-2">📦 Products</a>
        <a href="/sales" class="btn btn-success btn-lg me-2">💰 Record Sale / Utang</a>
        <a href="/add_product" class="btn btn-outline-success btn-lg">+ Add Product</a>
    </div>
</div>

<script>
function toggleTheme() {
    const html = document.documentElement;
    const theme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', theme);
    localStorage.setItem('theme', theme);
}
if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-bs-theme', 'light');
}
</script>
</body>
</html>
