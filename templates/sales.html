<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Utang - Princess Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>💰 Record Sale / Utang</h1>
    <a href="/" class="btn btn-secondary mb-3">← Dashboard</a>
    <a href="/products" class="btn btn-primary mb-3">📦 Products</a>
    <a href="/debts" class="btn btn-warning mb-3">📋 View All Utang</a>

    <!-- Record New Sale / Utang -->
    <div class="card mt-4">
        <div class="card-header">New Sale / Utang</div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Product</label>
                        <select name="product_id" class="form-select" required>
                            {% for p in products %}
                            <option value="{{ p['id'] }}">{{ p['name'] }} - ₱{{ p['price'] }} (Stock: {{ p['stock'] }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label>Quantity</label>
                        <input type="number" name="quantity" class="form-control" value="1" min="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Customer Name (for Utang)</label>
                        <input type="text" name="customer_name" class="form-control" placeholder="Leave blank if cash">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label>Date</label>
                        <input type="date" name="sale_date" class="form-control" value="{{ '' }}">
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg">Record Sale / Utang</button>
            </form>
        </div>
    </div>

        <h4>Daily Sales Report</h4>
